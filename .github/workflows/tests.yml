name: Tests

# Corre la suite en cada push y pull request. Los flujos críticos
# (tests/Feature/Flows) cubren compra → inventario → venta → caja,
# producción, transferencias, acceso por sucursal e integridad de permisos.
on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      mysql:
        # La misma serie que el MySQL que crea Coolify por defecto.
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v4

      # La misma versión menor que producción: Nixpacks instala PHP 8.4.2
      # ("php": "^8.4" y config.platform.php en composer.json) con estas
      # extensiones.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, pcntl, pdo_mysql, sodium, xmlreader, zip
          coverage: none

      - name: Cache de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-php8.4-${{ hashFiles('composer.lock') }}

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pruebas
        run: php artisan test
