; Límites de PHP-FPM para la app (PHP lee este archivo por directorio).
; Las fotos (productos, evidencias, recibos) se validan a 5 MB c/u y una
; petición puede traer varias; el PDF del corte (dompdf) necesita memoria.
; nginx.template.conf usa client_max_body_size 30M: mantener ambos alineados.
; nginx ya niega los archivos que empiezan con punto, así que no se sirve.
upload_max_filesize = 6M
post_max_size = 30M
memory_limit = 256M
; La app manda los formularios como multipart: cada campo cuenta. "Completar
; conteo" manda 7 campos por producto y con el default (1000) PHP descartaba
; el resto en silencio a partir de ~142 productos (el conteo quedaba a medias
; y sin _method). 10000 alcanza para ~1400 productos.
; max_multipart_body_parts sigue su default: max_input_vars + max_file_uploads.
max_input_vars = 10000
